name: Auto Commit

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup git identity
        run: |
          git config user.name "ckckckcz"
          git config user.email "rriovld@gmail.com"

      - name: Run daily commit program
        run: go run daily.go
